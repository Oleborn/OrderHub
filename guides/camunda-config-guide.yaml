# =============================================================================
# ПОЛНАЯ КОНФИГУРАЦИЯ CAMUNDA SPRING BOOT STARTER
# Префикс: camunda.bpm
# Версия: 7.22+
# =============================================================================

camunda:
  bpm:
    # -------------------------------------------------------------------------
    # 1. ОСНОВНЫЕ НАСТРОЙКИ ДВИЖКА (Process Engine)
    # -------------------------------------------------------------------------

    # Имя движка процессов. По умолчанию: "default"
    # Используется для идентификации движка при множественных экземплярах.
    process-engine-name: default

    # Генерировать уникальное имя движка автоматически (добавляет 10 случайных символов).
    # По умолчанию: false
    generate-unique-process-engine-name: false

    # Генерировать уникальное имя приложения процессов.
    # По умолчанию: false
    generate-unique-process-application-name: false

    # Генератор ID для экземпляров процессов и задач.
    # Возможные значения: "strong" (UUID), "uuid", "db" (и другие кастомные).
    # По умолчанию: "strong"
    id-generator: strong

    # Включить/выключить автоконфигурацию Camunda.
    # По умолчанию: true
    enabled: true

    # -------------------------------------------------------------------------
    # 2. УРОВЕНЬ ИСТОРИИ (History Level)
    # -------------------------------------------------------------------------

    # Уровень детализации хранения исторических данных.
    # Возможные значения:
    #   - "none"        - история не сохраняется (максимальная производительность)
    #   - "activity"    - сохраняются только переходы между активностями
    #   - "audit"       - сохраняются все детали (по умолчанию для Cockpit)
    #   - "full"        - сохраняется ВСЁ (включая переменные, детали форм и т.д.)
    # По умолчанию: "full" (в классе прописано ProcessEngineConfiguration.HISTORY_FULL)
    history-level: audit

    # Уровень истории по умолчанию, когда 'history-level' установлен в "auto".
    # По умолчанию: "full"
    history-level-default: full

    # -------------------------------------------------------------------------
    # 3. АВТОМАТИЧЕСКИЙ ДЕПЛОЙ BPMN-ПРОЦЕССОВ
    # -------------------------------------------------------------------------

    # Включить автоматический деплой BPMN/CMMN/DMN-файлов при старте.
    # По умолчанию: true (из класса: private boolean autoDeploymentEnabled = true)
    auto-deployment-enabled: true

    # Шаблон(ы) для поиска файлов процессов в classpath.
    # По умолчанию: classpath*:**/*.bpmn, classpath*:**/*.bpmn20.xml,
    #              classpath*:**/*.cmmn, classpath*:**/*.cmmn11.xml,
    #              classpath*:**/*.dmn, classpath*:**/*.dmn11.xml
    # Переопределяется, чтобы указать конкретную папку, например:
    deployment-resource-pattern: classpath:/processes/*.bpmn

    # -------------------------------------------------------------------------
    # 4. СЕРИАЛИЗАЦИЯ ПЕРЕМЕННЫХ
    # -------------------------------------------------------------------------

    # Формат сериализации переменных процесса по умолчанию.
    #   - "application/json"        - рекомендуется (безопасно, читаемо)
    #   - "application/x-java-serialized-object" - Java-сериализация (по умолчанию, НЕ безопасна)
    # По умолчанию: "application/x-java-serialized-object" (из Defaults.INSTANCE)
    default-serialization-format: application/json

    # -------------------------------------------------------------------------
    # 5. ЛИЦЕНЗИОННЫЙ ФАЙЛ (для Enterprise-версии)
    # -------------------------------------------------------------------------

    # Путь к файлу лицензии (поддерживается file: и classpath:).
    # license-file: file:/path/to/license.txt

    # -------------------------------------------------------------------------
    # 6. НАСТРОЙКИ БАЗЫ ДАННЫХ (Database)
    # -------------------------------------------------------------------------

    database:
      # Обновление схемы базы данных при старте.
      #   - "true"  - создаёт/обновляет таблицы (удобно для разработки)
      #   - "false" - только проверяет существование схемы (рекомендуется для production)
      # По умолчанию: "true" (из DatabaseProperty: private String schemaUpdate = DB_SCHEMA_UPDATE_TRUE)
      schema-update: true

      # Тип базы данных. Обычно определяется автоматически из URL.
      # Возможные значения: "h2", "mysql", "postgresql", "oracle", "db2", "mssql".
      # type: postgresql

      # Схема базы данных (для Oracle/PostgreSQL, если используется не public).
      # schema: public

      # Показывать SQL-запросы в логах.
      # show-sql: false

      # Формат даты/времени для БД.
      # jdbc-metadata-defaults: true

      # Таблица для блокировок (используется в кластере).
      # lock-table-name: ACT_GE_PROPERTY

      # Тип таблиц (для MySQL: InnoDB).
      # table-types: InnoDB

      # -------------------------------------------------------------------------
      # 7. НАСТРОЙКИ ВЫПОЛНЕНИЯ ЗАДАНИЙ (Job Execution)
      # -------------------------------------------------------------------------

    job-execution:
    # Включить/выключить Job Executor (асинхронные задания).
    # enabled: true

    # Количество потоков для выполнения заданий.
    # core-pool-size: 10

    # Максимальное количество потоков.
    # max-pool-size: 20

    # Время жизни потоков в миллисекундах.
    # keep-alive-time: 5000

    # Очередь заданий (LinkedBlockingQueue).
    # queue-capacity: 20

    # Время ожидания блокировки задания (в миллисекундах).
    # lock-time: 300000

    # Максимальное количество заданий, захватываемых за один раз.
    # max-jobs-per-acquisition: 3

    # Задержка между проверками новых заданий (в миллисекундах).
    # wait-time: 5000

    # Максимальное время, которое задание может выполняться (в миллисекундах).
    # max-time: 0

    # Включить приоритеты заданий.
    # acquire-by-priority: false

    # -------------------------------------------------------------------------
    # 8. МЕТРИКИ (Metrics)
    # -------------------------------------------------------------------------

    metrics:
    # Включить сбор метрик (через Micrometer).
    # enabled: false

    # Имя метрики для количества экземпляров процессов.
    # process-instance-count-name: camunda.process.instances

    # Имя метрики для количества заданий.
    # job-count-name: camunda.jobs

    # Имя метрики для количества выполненных заданий.
    # executed-decision-elements-count-name: camunda.decision.elements

    # -------------------------------------------------------------------------
    # 9. ВЕБ-ПРИЛОЖЕНИЯ (Webapp)
    # -------------------------------------------------------------------------

    webapp:
    # Включить веб-приложения Camunda (Cockpit, Tasklist, Admin).
    # enabled: true

    # Путь к веб-приложениям.
    # path: /camunda

    # Включить индексную страницу.
    # index-redirect-enabled: true

    # -------------------------------------------------------------------------
    # 10. REST API
    # -------------------------------------------------------------------------

    rest-api:
    # Включить REST API Camunda.
    # enabled: true

    # Путь к REST API.
    # path: /engine-rest

    # -------------------------------------------------------------------------
    # 11. АВТОРИЗАЦИЯ (Authorization)
    # -------------------------------------------------------------------------

    authorization:
    # Включить авторизацию.
    # enabled: false

    # Включить проверку прав на чтение истории.
    # history-cleanup: false

    # Проверять права на чтение истории для всех запросов.
    # history-cleanup-query: false

    # -------------------------------------------------------------------------
    # 12. ADMIN-ПОЛЬЗОВАТЕЛЬ (для веб-консолей)
    # -------------------------------------------------------------------------

    admin-user:
      # ID администратора (обязательно использовать переменные окружения в production).
      id: ${CAMUNDA_ADMIN_ID:admin}

      # Пароль администратора.
      password: ${CAMUNDA_ADMIN_PASSWORD:admin}

      # Имя пользователя для отображения.
      # firstname: Admin
      # lastname: User
      # email: admin@example.com

      # -------------------------------------------------------------------------
      # 13. ФИЛЬТРЫ (Filter)
      # -------------------------------------------------------------------------

    filter:
    # Создать стандартные фильтры для Tasklist.
    # create: true

    # -------------------------------------------------------------------------
    # 14. СОБЫТИЯ SPRING (Eventing)
    # -------------------------------------------------------------------------

    eventing:
    # Включить публикацию событий Spring ApplicationEvent.
    # enabled: true

    # Включить события для исторических данных.
    # history: false

    # -------------------------------------------------------------------------
    # 15. ОБЩИЕ СВОЙСТВА (Generic Properties)
    # -------------------------------------------------------------------------

    generic-properties:
      properties:
        # Принудительно применять время жизни истории (History Time To Live).
        # Если false, можно управлять TTL для каждого процесса отдельно.
        enforceHistoryTimeToLive: false

        # Другие кастомные свойства могут быть добавлены в виде ключ-значение.
        # Например:
        # my.custom.property: some-value
        # batch-operation-history-time-to-live: 7