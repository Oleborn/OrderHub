spring:
  data:
    redis:
      # -------- ОСНОВНЫЕ ПАРАМЕТРЫ ПОДКЛЮЧЕНИЯ --------

      # Индекс базы данных Redis (по умолчанию 0)
      database: 0

      # Полный URL подключения (переопределяет host/port/username/password/database)
      # Пример: redis://user:password@example.com:6379/8
      # url: redis://localhost:6379

      # Хост Redis-сервера (по умолчанию localhost)
      host: localhost

      # Имя пользователя (если требуется аутентификация)
      # username: myuser

      # Пароль (если требуется аутентификация)
      # password: secret

      # Порт Redis-сервера (по умолчанию 6379)
      port: 6379

      # Таймаут на чтение (ReadTimeout) — например, 2000ms, 5s
      timeout: 2000ms

      # Таймаут на установку соединения (ConnectTimeout)
      connectTimeout: 1000ms

      # Имя клиента, которое будет установлено командой CLIENT SETNAME
      # clientName: payment-service

      # Тип Redis-клиента: LETTUCE (по умолчанию) или JEDIS
      # clientType: LETTUCE

      # -------- НАСТРОЙКИ SSL (если используется защищённое соединение) --------
      ssl:
        # Включить SSL (автоматически включается, если указан bundle)
        enabled: false
        # Имя SSL-бандла (если используется конфигурация Spring Boot)
        # bundle: my-ssl-bundle

      # -------- НАСТРОЙКИ ДЛЯ РЕЖИМА SENTINEL (высокая доступность) --------
      sentinel:
      # Имя мастера (обязательно для sentinel-режима)
      # master: mymaster
      # Список узлов sentinel в формате "host:port"
      # nodes:
      #   - "sentinel1:26379"
      #   - "sentinel2:26379"
      #   - "sentinel3:26379"
      # Имя пользователя для аутентификации на sentinel (опционально)
      # username: sentineluser
      # Пароль для аутентификации на sentinel (опционально)
      # password: sentinelpass

      # -------- НАСТРОЙКИ ДЛЯ РЕЖИМА CLUSTER (кластер Redis) --------
      cluster:
      # Список начальных узлов кластера (минимум один) в формате "host:port"
      # nodes:
      #   - "node1:7000"
      #   - "node2:7001"
      #   - "node3:7002"
      # Максимальное количество перенаправлений (редиректов) при выполнении команд
      # maxRedirects: 3

      # -------- НАСТРОЙКИ КЛИЕНТА JEDIS (если выбран clientType=JEDIS) --------
      jedis:
        pool:
          # Включить пул соединений (автоматически, если есть commons-pool2)
          enabled: true
          # Максимальное количество "холостых" (idle) соединений в пуле
          # (отрицательное значение = безлимит)
          maxIdle: 8
          # Минимальное количество idle-соединений, которое пул старается поддерживать
          minIdle: 0
          # Максимальное количество активных соединений (отрицательное = безлимит)
          maxActive: 8
          # Максимальное время ожидания свободного соединения из пула
          # (отрицательное = бесконечное ожидание)
          maxWait: -1ms
          # Интервал между проверками idle-соединений (если > 0, запускается поток evictor)
          timeBetweenEvictionRuns: 30000ms

      # -------- НАСТРОЙКИ КЛИЕНТА LETTUCE (используется по умолчанию) --------
      lettuce:
        # Таймаут при завершении работы клиента (shutdown timeout)
        shutdownTimeout: 100ms

        # Откуда читать данные в кластерной/реплицированной конфигурации.
        # Возможные значения: MASTER, MASTER_PREFERRED, REPLICA_PREFERRED, REPLICA, ANY,
        # а также кастомные реализации через ReadFrom.
        # readFrom: MASTER_PREFERRED

        pool:
          # Включить пул соединений (автоматически, если есть commons-pool2)
          enabled: true
          # Максимальное количество idle-соединений
          maxIdle: 8
          # Минимальное количество idle-соединений
          minIdle: 0
          # Максимальное количество активных соединений
          maxActive: 8
          # Максимальное время ожидания свободного соединения
          maxWait: -1ms
          # Интервал между проверками idle-соединений (если > 0, запускается evictor)
          timeBetweenEvictionRuns: 30000ms

        # Настройки обновления топологии кластера (только для кластерного режима)
        cluster:
          refresh:
            # Обнаруживать и опрашивать все узлы кластера для получения топологии.
            # Если false, используются только начальные seed-узлы.
            dynamicRefreshSources: true
            # Период обновления топологии кластера (если не задан, обновления не происходит)
            # period: 60s
            # Использовать адаптивное обновление топологии (по различным триггерам)
            adaptive: false